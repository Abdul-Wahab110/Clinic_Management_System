<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Role Workspace... | AuraCare</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="display: grid; place-items: center; min-height: 100vh; background: var(--color-slate-100);">
  <div class="text-center">
    <div class="brand-icon-box" style="margin: 0 auto var(--space-4) auto; width: 60px; height: 60px; font-size: 2rem;">
      <i class="fa-solid fa-staff-snake"></i>
    </div>
    <h2>Accessing AuraCare Portal</h2>
    <p class="text-muted">Verifying authentication credentials and permissions...</p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/responsive.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.isAuthenticated()) {
        window.location.href = '/pages/login.html';
        return;
      }
      const user = await Auth.fetchProfile();
      if (user && user.role) {
        window.location.href = Auth.getDashboardUrl(user.role);
      } else {
        window.location.href = '/pages/login.html';
      }
    });
  </script>
</body>
</html>
