<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | AuraCare Medical Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="background: var(--color-slate-100); min-height: 100vh; display: grid; place-items: center; padding: var(--space-4);">

  <div class="card" style="width: 100%; max-width: 460px; box-shadow: var(--shadow-xl);">
    <div class="card-body" style="padding: var(--space-8);">
      
      <div class="text-center mb-6">
        <a href="/" class="brand-logo-grid" style="justify-content: center; margin-bottom: var(--space-3);">
          <div class="brand-icon-box">
            <i class="fa-solid fa-key"></i>
          </div>
          <span>AuraCare</span>
        </a>
        <h2 style="font-size: var(--font-size-2xl);">Password Recovery</h2>
        <p class="text-muted" style="font-size: var(--font-size-sm); margin-top: var(--space-1);">
          Enter your registered email address to generate a secure password reset token.
        </p>
      </div>

      <div id="reset-result-box" class="hidden mb-4" style="padding: var(--space-4); background: var(--color-success-light); border: 1px solid var(--color-success-border); border-radius: var(--radius-md);">
        <p id="reset-result-text" class="text-success font-medium" style="margin-bottom: var(--space-2); font-size: var(--font-size-sm);"></p>
        <div id="demo-token-display" class="hidden" style="background: white; padding: var(--space-2); border-radius: var(--radius-sm); font-family: monospace; font-size: var(--font-size-xs); word-break: break-all; margin-top: var(--space-2);"></div>
        <a id="demo-reset-link" href="/pages/reset-password.html" class="btn btn-primary btn-sm btn-block mt-3 hidden">Proceed to Reset Password &rarr;</a>
      </div>

      <form id="form-forgot">
        <div class="form-group mb-4">
          <label class="form-label" for="forgot-email">Account Email Address <span class="required">*</span></label>
          <input type="email" id="forgot-email" name="email" class="form-input" placeholder="e.g. admin@auracare.com" required>
        </div>

        <button type="submit" id="btn-forgot-submit" class="btn btn-primary btn-block">
          <i class="fa-regular fa-paper-plane"></i> Request Reset Link
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm);">
        <a href="/pages/login.html">&larr; Back to Login</a>
      </div>

    </div>
  </div>

  <div class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/responsive.js"></script>
  <script src="/js/toast.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-forgot');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('btn-forgot-submit');
        const email = form.email.value.trim();

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = 'Generating token...';

          const res = await API.post('/auth/forgot-password', { email });
          
          document.getElementById('reset-result-box').classList.remove('hidden');
          document.getElementById('reset-result-text').textContent = res.message || 'Reset token generated.';

          if (res.data && res.data.demoResetToken) {
            const tokenDisplay = document.getElementById('demo-token-display');
            const resetLink = document.getElementById('demo-reset-link');
            tokenDisplay.classList.remove('hidden');
            tokenDisplay.innerHTML = `<strong>Local Demo Reset Token:</strong><br>${res.data.demoResetToken}`;
            resetLink.classList.remove('hidden');
            resetLink.href = `/pages/reset-password.html?token=${res.data.demoResetToken}`;
          }

          Toast.success('Password reset instructions generated.');
        } catch (err) {
          Toast.error(err.message || 'Request failed.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> Request Reset Link';
        }
      });
    });
  </script>
</body>
</html>
