<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | AuraCare Medical Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="display: grid; place-items: center; min-height: 100vh; background: var(--color-slate-100); padding: var(--space-4);">

  <div class="card" style="width: 100%; max-width: 520px; text-align: center; box-shadow: var(--shadow-xl);">
    <div class="card-body" style="padding: var(--space-10);">
      
      <div class="brand-icon-box" style="margin: 0 auto var(--space-4) auto; width: 64px; height: 64px; font-size: 2rem; background: var(--color-danger-light); color: var(--color-danger);">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>

      <h1 style="font-size: var(--font-size-4xl); color: var(--color-navy-900); margin-bottom: var(--space-2);">404</h1>
      <h3 style="font-size: var(--font-size-xl); margin-bottom: var(--space-3);">Page or Clinical Record Not Found</h3>
      <p class="text-muted" style="font-size: var(--font-size-sm); margin-bottom: var(--space-6);">
        The medical page or resource you requested does not exist or may have been moved to another clinical department.
      </p>

      <div style="display: flex; justify-content: center; gap: var(--space-3);">
        <a href="/" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Clinic Homepage
        </a>
        <a href="/pages/login.html" class="btn btn-outline">
          <i class="fa-solid fa-user-lock"></i> Portal Login
        </a>
      </div>

    </div>
  </div>

  <script src="/js/responsive.js"></script>
</body>
</html>
