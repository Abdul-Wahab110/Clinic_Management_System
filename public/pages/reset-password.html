<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AuraCare Medical Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="background: var(--color-slate-100); min-height: 100vh; display: grid; place-items: center; padding: var(--space-4);">

  <div class="card" style="width: 100%; max-width: 460px; box-shadow: var(--shadow-xl);">
    <div class="card-body" style="padding: var(--space-8);">
      
      <div class="text-center mb-6">
        <a href="/" class="brand-logo-grid" style="justify-content: center; margin-bottom: var(--space-3);">
          <div class="brand-icon-box">
            <i class="fa-solid fa-lock"></i>
          </div>
          <span>AuraCare</span>
        </a>
        <h2 style="font-size: var(--font-size-2xl);">Set New Password</h2>
        <p class="text-muted" style="font-size: var(--font-size-sm); margin-top: var(--space-1);">
          Enter your verification reset token and choose a new secure password.
        </p>
      </div>

      <form id="form-reset">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="reset-token">Reset Token <span class="required">*</span></label>
            <input type="text" id="reset-token" name="token" class="form-input" placeholder="Paste reset token..." required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reset-new-password">New Password <span class="required">*</span></label>
            <input type="password" id="reset-new-password" name="new_password" class="form-input" placeholder="••••••••" required>
            <span class="form-help">Min 8 chars, 1 uppercase, 1 number, 1 special character.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="reset-confirm-password">Confirm New Password <span class="required">*</span></label>
            <input type="password" id="reset-confirm-password" name="confirm_password" class="form-input" placeholder="••••••••" required>
          </div>

          <button type="submit" id="btn-reset-submit" class="btn btn-primary btn-block mt-2">
            <i class="fa-solid fa-check"></i> Update Password
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-sm);">
        <a href="/pages/login.html">&larr; Return to Sign In</a>
      </div>

    </div>
  </div>

  <div class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/responsive.js"></script>
  <script src="/js/toast.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenParam = urlParams.get('token');
      if (tokenParam) {
        document.getElementById('reset-token').value = tokenParam;
      }

      const form = document.getElementById('form-reset');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const token = form.token.value.trim();
        const newPassword = form.new_password.value;
        const confirmPassword = form.confirm_password.value;

        if (newPassword !== confirmPassword) {
          Toast.error('Passwords do not match.');
          return;
        }

        const submitBtn = document.getElementById('btn-reset-submit');
        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = 'Updating Password...';

          const res = await API.post('/auth/reset-password', {
            token,
            new_password: newPassword
          });

          Toast.success('Password updated successfully!');
          setTimeout(() => {
            window.location.href = '/pages/login.html?password_reset=1';
          }, 600);
        } catch (err) {
          Toast.error(err.message || 'Password reset failed.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Update Password';
        }
      });
    });
  </script>
</body>
</html>
